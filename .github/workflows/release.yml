name: Build & Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit & DSP tests
        run: swift test

      - name: Extract version
        id: version
        run: |
          RAW="${GITHUB_REF_NAME:-v1.0.0}"
          VER="${RAW#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build macOS DMG installer
        run: |
          chmod +x ./scripts/build-dmg.sh
          ./scripts/build-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-macOS-DMG
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.sha256 \
              --title "VoiceStudio ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
